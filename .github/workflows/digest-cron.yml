name: Scheduled deadline reminders

# Run deadline batches hourly. The 08:17 UTC run (09:17 WAT) also runs the
# existing daily new-match push and admin opportunity flag maintenance.
on:
  schedule:
    - cron: "17 0-7,9-23 * * *"
    - cron: "17 8 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: manual-deadline-push-check
  cancel-in-progress: false

jobs:
  trigger-deadline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run deadline discovery and delivery batches
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if ! python3 - <<'PY'
          import ipaddress
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          value = os.environ.get("APP_URL", "")

          try:
              if not value.startswith("https://"):
                  raise ValueError("scheme must be exactly https")
              if any(char.isspace() or ord(char) < 32 or ord(char) == 127 for char in value):
                  raise ValueError("whitespace or control characters are not allowed")
              if "\\" in value:
                  raise ValueError("backslashes are not allowed")
              if "?" in value or "#" in value:
                  raise ValueError("query strings and fragments are not allowed")

              parsed = urlsplit(value)
              if parsed.scheme != "https":
                  raise ValueError("scheme must be exactly https")
              if parsed.username is not None or parsed.password is not None:
                  raise ValueError("embedded credentials are not allowed")
              if not parsed.hostname:
                  raise ValueError("hostname is required")
              if parsed.netloc.endswith(":"):
                  raise ValueError("port must be numeric")

              port = parsed.port
              if port is not None and not 1 <= port <= 65535:
                  raise ValueError("port is outside the valid range")

              hostname = parsed.hostname
              if hostname.endswith(".."):
                  raise ValueError("hostname must not have multiple trailing dots")
              if hostname.endswith("."):
                  hostname = hostname[:-1]
              if not hostname:
                  raise ValueError("hostname is required")
              try:
                  ipaddress.ip_address(hostname)
              except ValueError:
                  try:
                      ascii_hostname = hostname.encode("idna").decode("ascii")
                  except UnicodeError as exc:
                      raise ValueError("hostname is not valid DNS syntax") from exc
                  if len(ascii_hostname) > 253:
                      raise ValueError("hostname is too long")
                  labels = ascii_hostname.split(".")
                  if any(
                      not label
                      or len(label) > 63
                      or label[0] == "-"
                      or label[-1] == "-"
                      or re.fullmatch(r"[A-Za-z0-9-]+", label) is None
                      for label in labels
                  ):
                      raise ValueError("hostname is not valid DNS syntax")
          except ValueError as exc:
              print(f"APP_URL validation failed: {exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          then
            echo "::error::APP_URL must be a valid HTTPS URL without credentials, query strings, fragments, or invalid host syntax."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          endpoint="${APP_URL%/}/api/cron/deadline-check"

          call_task() {
            local task="$1" response code timeout=75
            if [ "$task" = maintenance ]; then timeout=300; fi
            if [ "$task" = new_match ]; then timeout=120; fi
            response=$(mktemp)
            if ! code=$(curl --silent --show-error \
              --request POST --proto '=https' --max-time "$timeout" \
              -o "$response" -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" "$endpoint?task=$task"); then
              rm -f "$response"
              return 1
            fi
            if [ "$code" != "200" ]; then
              echo "::error::Deadline $task returned HTTP $code" >&2
              rm -f "$response"
              return 1
            fi
            cat "$response"
            rm -f "$response"
          }

          drain_channel() {
            local channel="$1" limit="$2" result
            for ((batch=0; batch<limit && SECONDS<drain_until; batch++)); do
              result=$(call_task "$channel") || return 1
              echo "$channel $result"
              if ! jq -e 'type == "object" and (.more | type == "boolean")' <<< "$result" >/dev/null; then
                echo "::error::Unexpected deadline $channel response"
                return 1
              fi
              if ! jq -e '.more' <<< "$result" >/dev/null; then
                return 0
              fi
            done
            echo "::error::Deadline $channel reached its batch or time limit. Work may remain."
            return 1
          }

          drain_new_match() {
            local result
            for ((batch=0; batch<48 && SECONDS<drain_until; batch++)); do
              result=$(call_task new_match) || return 1
              echo "new_match $result"
              if ! jq -e 'type == "object" and (.push_campaign.incomplete | type == "boolean")' <<< "$result" >/dev/null; then
                echo "::error::Unexpected deadline new_match response"
                return 1
              fi
              if jq -e '.push_campaign.phase == "busy"' <<< "$result" >/dev/null ||
                ! jq -e '.push_campaign.incomplete' <<< "$result" >/dev/null; then
                return 0
              fi
            done
            echo "::notice::New-match drain reached its limit. The next hourly run will resume queued work."
          }

          run_new_match() {
            local maintenance result=0 drain_until=$((SECONDS + 720))
            if [ "$SCHEDULE" = '17 8 * * *' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
              if maintenance=$(call_task maintenance); then
                echo "maintenance $maintenance"
              else
                result=1
              fi
            fi
            drain_new_match || result=1
            return "$result"
          }

          status=0
          run_new_match &
          new_match_pid=$!

          if prepared=$(call_task prepare) &&
            jq -e '(.capacityReached | type == "boolean") and (.generated | type == "number")' <<< "$prepared" >/dev/null; then
            echo "prepare $prepared"
            if jq -e '.capacityReached' <<< "$prepared" >/dev/null; then
              echo "::error::Deadline discovery or inbox reached its row limit. Work may remain."
              status=1
            fi
            drain_until=$((SECONDS + 720))
            drain_channel push 16 &
            push_pid=$!
            drain_channel email 12 &
            email_pid=$!
            wait "$push_pid" || status=1
            wait "$email_pid" || status=1
            if receipts=$(call_task receipts); then
              echo "receipts $receipts"
              if jq -e '.unavailable > 0' <<< "$receipts" >/dev/null; then
                echo "::warning::Some Mailtrap delivery logs were unavailable"
              fi
            else
              status=1
            fi
            if backlog=$(call_task backlog) &&
              jq -e '[.inApp, .push, .email] | all(type == "number")' <<< "$backlog" >/dev/null; then
              echo "backlog $backlog"
              if jq -e '.inApp + .push + .email > 0' <<< "$backlog" >/dev/null; then
                echo "::error::Urgent deadline work remains. See backlog counts and the email quota flag above."
                status=1
              fi
            else
              echo "::error::Could not verify urgent deadline backlog"
              status=1
            fi
            if jq -e '.emailEnabled and (.emailConfigured | not)' <<< "$prepared" >/dev/null; then
              echo "::error::Deadline email is enabled but its configuration is incomplete"
              status=1
            fi
          else
            echo "::error::Could not prepare deadline reminders"
            status=1
          fi

          wait "$new_match_pid" || status=1
          exit "$status"
