name: digest-cron

# Free cron replacement for Vercel Hobby (which caps crons at once/day).
# Every 2 hours UTC it calls the Scholars cron endpoint with the repo
# secret. workflow_dispatch also gives a manual "Run workflow" button in
# the Actions tab, so the owner can fire the digest from a phone anytime.
#
# SETUP (one time): add a repository secret named CRON_SECRET whose value
# matches the CRON_SECRET env var on Vercel. GitHub -> repo -> Settings ->
# Secrets and variables -> Actions -> New repository secret.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: digest-cron
  cancel-in-progress: false

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Scholars deadline-check digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://scholars.com.ng' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          code=$(curl -s -o /tmp/digest.json -w "%{http_code}" \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/deadline-check")
          echo "HTTP status: $code"
          cat /tmp/digest.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Digest endpoint returned HTTP $code"
            exit 1
          fi
