name: Manual deadline and push check

# This endpoint is push-only. Keep it manually dispatchable, but never run it
# on a timer: all non-authentication email must require a human action.
on:
  workflow_dispatch: {}

concurrency:
  group: manual-deadline-push-check
  cancel-in-progress: false

jobs:
  trigger-deadline-push-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the push-only Scholars deadline check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://www.scholars.com.ng' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          code=$(curl --location -s -o /tmp/digest.json -w "%{http_code}" \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/deadline-check")
          echo "HTTP status: $code"
          cat /tmp/digest.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Digest endpoint returned HTTP $code"
            exit 1
          fi
