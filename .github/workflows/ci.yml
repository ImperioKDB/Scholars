name: ci
# Safety net for the Colab-push workflow: every push and PR gets a full
# typecheck, test suite, and production build before Vercel deploys it.
# Placeholder public Supabase values are used only to initialize the public
# client during the build. Request-time data routes, including /sitemap.xml,
# must not require production database availability during CI. No production
# credentials are required in this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
