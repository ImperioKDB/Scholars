name: Re-engagement enrollment

# Free runner for Scholars campaign orchestration.
# Manual-only by design: scheduling is added only after an experiment is explicitly approved.
on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Active Scholars experiment UUID
        required: true
        type: string
      request_id:
        description: Unique run identifier, for example manual-2026-09-16-01
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reengagement-enrollment-${{ inputs.experiment_id }}
  cancel-in-progress: false

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Enroll treatment assignments into Scholars outbox
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://scholars.com.ng' }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"experiment_id\":\"$EXPERIMENT_ID\",\"request_id\":\"$REQUEST_ID\"}" \
            "$APP_URL/api/integrations/github/reengagement")
          echo "$response"
          echo "$response" | grep -q '"ok":true'
