name: Scholarship discovery quality scoring

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: read

concurrency:
  group: scholarship-quality
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Load candidates needing scoring
        id: candidates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://www.scholars.com.ng' }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          response=$(curl --fail-with-body --silent --show-error --location --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/integrations/github/scholarship-quality")
          ids=$(echo "$response" | jq -c '.candidate_ids')
          echo "candidate_ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Score candidates
        if: steps.candidates.outputs.candidate_ids != '[]'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://www.scholars.com.ng' }}
          CANDIDATE_IDS: ${{ steps.candidates.outputs.candidate_ids }}
        run: |
          set -euo pipefail
          payload=$(jq -cn --argjson ids "$CANDIDATE_IDS" '{candidate_ids: $ids}')
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' \
            --data "$payload" "$APP_URL/api/integrations/github/scholarship-quality"
