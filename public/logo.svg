<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Scholars brand mark</title>
  <desc id="desc">A navy S-shaped mark crossed by a teal arrow rising upward.</desc>
  <defs>
    <linearGradient id="navy" x1="0.18" y1="0.08" x2="0.84" y2="0.92">
      <stop offset="0" stop-color="#30336f" />
      <stop offset="0.52" stop-color="#272a5f" />
      <stop offset="1" stop-color="#202653" />
    </linearGradient>
    <linearGradient id="arrow" x1="0.08" y1="0.88" x2="0.88" y2="0.1">
      <stop offset="0" stop-color="#28577d" />
      <stop offset="0.4" stop-color="#2c9fa1" />
      <stop offset="0.78" stop-color="#31b3ae" />
      <stop offset="1" stop-color="#2c9fa1" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32b7b2" />
      <stop offset="1" stop-color="#2c9fa1" />
    </linearGradient>
    <symbol id="mark" viewBox="0 0 1024 1024">
      <!-- Upper bowl of the original S silhouette. -->
      <path fill="url(#navy)" d="M530 82c-143 0-266 38-329 132-57 85-56 192 5 264 54 64 136 99 262 123l92-113c-88-16-151-31-187-61-31-26-42-59-31-97 14-49 73-78 153-78 71 0 130 17 185 54l86-104C689 121 618 82 530 82Z" />
      <!-- Lower bowl completes the S while leaving a clean diagonal opening. -->
      <path fill="url(#navy)" d="M543 551c84 16 145 33 181 64 31 27 39 62 27 98-16 48-74 76-153 76-80 0-143-20-202-65l-91 105c80 64 174 97 289 97 141 0 262-43 322-133 54-82 51-184-10-253-52-59-133-94-255-118l-108 129Z" />
      <!-- Restrained teal accent lines retain their original relationship to the S. -->
      <path fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="11" d="M286 335c3-86 44-153 115-198 40-25 84-40 132-46" />
      <path fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="11" d="M743 680c-5 82-45 146-111 188-36 23-76 37-119 43" />
      <!-- The original upward arrow, rebuilt as one continuous smooth ribbon. -->
      <path fill="url(#arrow)" d="M188 746c242-86 428-224 548-438l-52-10 126-126 47 174-52-14c-111 265-302 449-586 549l-31-135Z" />
    </symbol>
  </defs>
  <use href="#mark" />
</svg>
