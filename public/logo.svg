<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Scholars brand mark</title>
  <desc id="desc">A navy S-shaped mark crossed by a rising teal arrow.</desc>
  <symbol id="mark" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#25245f" />
        <stop offset="1" stop-color="#17194e" />
      </linearGradient>
      <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#24618a" />
        <stop offset="0.45" stop-color="#25a9ae" />
        <stop offset="1" stop-color="#3ac1b9" />
      </linearGradient>
    </defs>

    <!-- Upper and lower S bowls. The open diagonal keeps the mark legible at favicon size. -->
    <path fill="url(#navy)" d="M765 164C662 91 512 75 391 119C262 166 185 274 195 393C205 516 294 601 432 634L510 543C416 524 349 475 342 393C335 314 396 255 484 235C570 215 652 234 714 278L765 164Z" />
    <path fill="url(#navy)" d="M258 860C367 934 516 948 641 901C766 854 841 752 831 634C821 517 734 428 597 394L519 485C614 505 680 555 687 636C694 714 633 773 546 792C458 811 374 793 311 747L258 860Z" />

    <!-- Fine inner teal accents echo the reference image without adding visual noise. -->
    <path d="M281 189C215 261 198 350 223 429C250 514 318 568 412 594" fill="none" stroke="#32b8b3" stroke-width="15" stroke-linecap="round" />
    <path d="M743 835C809 762 826 673 801 594C774 510 706 458 612 433" fill="none" stroke="#32b8b3" stroke-width="15" stroke-linecap="round" />

    <!-- White separation band makes the rising arrow read clearly against both bowls. -->
    <path d="M213 766C421 709 633 522 794 172" fill="none" stroke="#fff" stroke-width="121" stroke-linecap="butt" />
    <path d="M213 766C421 709 633 522 794 172" fill="none" stroke="url(#arrow)" stroke-width="91" stroke-linecap="butt" />

    <!-- Arrowhead aligned to the same rising trajectory. -->
    <path fill="url(#arrow)" d="M793 103L864 286L793 269L753 367L700 318L739 220L689 211L793 103Z" />
  </symbol>

  <use href="#mark" />
</svg>
