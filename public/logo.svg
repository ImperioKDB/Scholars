<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Scholars brand mark</title>
  <desc id="desc">A polished navy S mark crossed by a rising teal arrow.</desc>
  <symbol id="mark" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="navy" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#2d2b6b" />
        <stop offset="0.56" stop-color="#25265f" />
        <stop offset="1" stop-color="#181b50" />
      </linearGradient>
      <linearGradient id="ribbon" x1="0.03" y1="0.92" x2="0.98" y2="0.06">
        <stop offset="0" stop-color="#245b84" />
        <stop offset="0.34" stop-color="#218aa0" />
        <stop offset="0.7" stop-color="#2bb5b2" />
        <stop offset="1" stop-color="#38c1b8" />
      </linearGradient>
      <linearGradient id="ribbonEdge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1d527b" />
        <stop offset="1" stop-color="#16647e" />
      </linearGradient>
    </defs>

    <!-- Clean upper bowl of the S. -->
    <path fill="url(#navy)" d="M695 157C574 82 414 79 291 143C170 206 107 321 128 438C150 562 246 647 392 680L467 573C378 553 312 509 286 441C256 363 293 289 365 247C452 197 561 199 647 248L695 157Z" />

    <!-- Clean lower bowl of the S. -->
    <path fill="url(#navy)" d="M330 866C451 945 612 941 733 872C850 805 902 683 874 570C848 467 764 399 635 366L563 473C649 495 712 541 730 605C751 680 712 753 640 790C554 834 454 823 374 773L330 866Z" />

    <!-- Fine turquoise contour accents visible inside each bowl. -->
    <path d="M236 204C162 283 151 382 189 468C222 542 290 591 382 617" fill="none" stroke="#35b9b4" stroke-width="16" stroke-linecap="round" />
    <path d="M765 827C833 750 844 662 813 584C785 514 719 464 635 438" fill="none" stroke="#35b9b4" stroke-width="16" stroke-linecap="round" />

    <!-- White clearance separates the rising ribbon from the S bowls. -->
    <path d="M143 806C379 744 602 546 777 177" fill="none" stroke="#ffffff" stroke-width="128" stroke-linecap="butt" />

    <!-- Rising ribbon with a subtle blue-to-teal gradient. -->
    <path d="M143 806C379 744 602 546 777 177" fill="none" stroke="url(#ribbon)" stroke-width="91" stroke-linecap="butt" />

    <!-- Slightly deeper lower edge gives the ribbon the dimensional finish of the reference. -->
    <path d="M143 806C365 747 590 553 754 206" fill="none" stroke="url(#ribbonEdge)" stroke-width="24" stroke-linecap="butt" opacity="0.72" />

    <!-- Integrated arrowhead, pointed toward the upper-right. -->
    <path fill="url(#ribbon)" d="M777 105L850 286L786 267L748 364L693 315L731 218L678 208L777 105Z" />
  </symbol>

  <use href="#mark" />
</svg>
